<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zárate Analítica | Core Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; }
    </style>
</head>
<body class="p-8">

    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <h1 class="text-2xl font-black text-gray-900 mb-2">Zárate Analítica | Motor de Prueba v2.0</h1>
        <p class="text-sm text-gray-500 mb-6">Escáner flexible con diagnóstico integrado.</p>

        <!-- PANEL DE CARGA -->
        <div class="bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl p-8 text-center mb-8">
            <input type="file" id="file-input" multiple accept=".xlsx,.xls" class="hidden" onchange="procesarArchivos(this.files)">
            <label for="file-input" class="cursor-pointer bg-black hover:bg-gray-800 text-white font-bold py-3 px-6 rounded-lg transition inline-block">
                📁 Seleccionar Excel Zárate
            </label>
            <p id="status-text" class="mt-4 text-sm font-medium text-gray-600">Esperando archivo...</p>
        </div>

        <!-- TABLA DE RESULTADOS CRUDOS -->
        <div class="overflow-x-auto border border-gray-200 rounded-lg">
            <table class="w-full text-left text-sm whitespace-nowrap">
                <thead class="bg-gray-100 text-gray-600 font-bold uppercase tracking-wider text-[11px]">
                    <tr>
                        <th class="px-4 py-3">Matriz</th>
                        <th class="px-4 py-3">Lote / Detalle</th>
                        <th class="px-4 py-3">Patente</th>
                        <th class="px-4 py-3">Cliente (RUT)</th>
                        <th class="px-4 py-3 text-right">Adjudicado</th>
                        <th class="px-4 py-3 text-center">Cant. Pujas</th>
                    </tr>
                </thead>
                <tbody id="tabla-body" class="divide-y divide-gray-100">
                    <tr>
                        <td colspan="6" class="px-4 py-8 text-center text-gray-400">Sube un archivo para ver los datos extraídos.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- PANEL DE DIAGNÓSTICO (DEBUG) -->
        <div id="debug-panel" class="hidden mt-8 bg-red-50 border border-red-200 rounded-lg p-4">
            <h3 class="font-bold text-red-800 mb-2 text-sm">⚠️ Panel de Diagnóstico (Copia esto si falla)</h3>
            <pre id="debug-text" class="text-[11px] text-red-700 whitespace-pre-wrap overflow-auto max-h-96"></pre>
        </div>
    </div>

<script>
const formatMoney = (num) => { 
    return '$' + new Intl.NumberFormat('es-CL').format(Math.round(num || 0)); 
};

async function procesarArchivos(files) {
    const statusText = document.getElementById('status-text');
    const tablaBody = document.getElementById('tabla-body');
    const debugPanel = document.getElementById('debug-panel');
    const debugText = document.getElementById('debug-text');
    
    debugPanel.classList.add('hidden');
    debugText.innerText = "";
    
    if(!files.length) return;
    statusText.innerText = "Leyendo archivo... espere.";
    statusText.className = "mt-4 text-sm font-bold text-blue-600";
    
    try {
        let todosLosLotes = [];
        let debugInfoArray = [];

        for(let i=0; i<files.length; i++) {
            const data = await parseZarateExcel(files[i]);
            debugInfoArray.push(data.debug);
            todosLosLotes = todosLosLotes.concat(data.adjudicaciones.map(adj => ({...adj, matriz: data.fileName})));
        }

        // Renderizar Tabla
        if(todosLosLotes.length === 0) {
            tablaBody.innerHTML = `<tr><td colspan="6" class="px-4 py-8 text-center text-red-500 font-bold">El sistema no pudo encontrar compras válidas. Revisa el diagnóstico abajo.</td></tr>`;
            
            // Mostrar info de debug
            debugPanel.classList.remove('hidden');
            let debugStr = debugInfoArray.map(d => `
Archivo: ${d.fileName}
Pestaña principal leída: ${d.sheetName}
Fila detectada como cabecera: ${d.headerRowIndex} (Puntaje de certeza: ${d.maxScore})
Columnas encontradas: ${JSON.stringify(d.detectedHeaders)}

--- Muestra de los primeros 2 registros crudos encontrados ---
Fila 1: ${JSON.stringify(d.sampleData[0] || {})}
Fila 2: ${JSON.stringify(d.sampleData[1] || {})}
-------------------------------------------------------------------
`).join('\n');
            debugText.innerText = debugStr;
            
            statusText.innerText = "Lectura fallida (0 lotes).";
            statusText.className = "mt-4 text-sm font-bold text-red-600";
        } else {
            tablaBody.innerHTML = todosLosLotes.map(lote => `
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-3 font-medium text-gray-900">${lote.matriz}</td>
                    <td class="px-4 py-3 truncate max-w-xs" title="${lote.loteStr}">
                        <span class="font-bold">Lote ${lote.numeroLote || '-'}</span>: ${lote.loteStr}
                    </td>
                    <td class="px-4 py-3 text-gray-500">${lote.patente || '-'}</td>
                    <td class="px-4 py-3">
                        <div class="font-bold">${lote.nombreRaw}</div>
                        <div class="text-[10px] text-gray-500">${lote.rut || '-'}</div>
                    </td>
                    <td class="px-4 py-3 text-right font-black text-emerald-600">${formatMoney(lote.monto)}</td>
                    <td class="px-4 py-3 text-center font-bold">${lote.pujasCount}</td>
                </tr>
            `).join('');
            
            statusText.innerText = `¡Lectura exitosa! Se encontraron ${todosLosLotes.length} lotes vendidos.`;
            statusText.className = "mt-4 text-sm font-bold text-emerald-600";
        }

    } catch (e) {
        statusText.innerText = "Error crítico: " + e.message;
        statusText.className = "mt-4 text-sm font-bold text-red-600";
        console.error(e);
    }
}

function parseZarateExcel(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                
                // --- 1. LEER ADJUDICACIONES ---
                let sheetAdjName = workbook.SheetNames.find(s => s.toLowerCase().includes('adjudicaciones')) || workbook.SheetNames[0];
                const rowsAdj = XLSX.utils.sheet_to_json(workbook.Sheets[sheetAdjName], {header: 1, defval: ""});
                
                // SISTEMA DE PUNTAJE PARA ENCONTRAR CABECERAS
                let maxScore = 0;
                let headerIdx = 0;
                let headers = [];
                
                for(let i=0; i<Math.min(rowsAdj.length, 20); i++){
                    let rowStr = rowsAdj[i].map(c => String(c).toLowerCase().trim()).join(' ');
                    let score = 0;
                    if(rowStr.includes('rut')) score++;
                    if(rowStr.includes('nombre') || rowStr.includes('cliente') || rowStr.includes('adjudicatario')) score++;
                    if(rowStr.includes('monto') || rowStr.includes('adjudicad') || rowStr.includes('total')) score++;
                    if(rowStr.includes('lote') || rowStr.includes('numero')) score++;
                    if(rowStr.includes('patente') || rowStr.includes('descripci') || rowStr.includes('vehiculo')) score++;
                    
                    if(score > maxScore) {
                        maxScore = score;
                        headerIdx = i;
                        headers = rowsAdj[i].map(c => String(c).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, ''));
                    }
                }

                let adjudicaciones = [];
                let debugLog = {
                    fileName: file.name,
                    sheetName: sheetAdjName,
                    detectedHeaders: headers,
                    headerRowIndex: headerIdx + 1, // Visual +1 for humans
                    maxScore: maxScore,
                    sampleData: []
                };

                for(let i = headerIdx + 1; i < rowsAdj.length; i++) {
                    if(rowsAdj[i].join('').trim() === '') continue;
                    
                    let obj = {};
                    for(let j=0; j<headers.length; j++) {
                        if(headers[j]) obj[headers[j]] = rowsAdj[i][j];
                    }
                    
                    if (debugLog.sampleData.length < 2) {
                        debugLog.sampleData.push(obj);
                    }
                    
                    let detalleVal = obj['descripcion'] || obj['vehiculo'] || obj['detalle'] || obj['bien'] || obj['lote'] || '';
                    if (typeof detalleVal === 'string' && detalleVal.includes('<table')) {
                        detalleVal = detalleVal.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
                    }

                    let numVal = String(obj['numero'] || obj['nrolote'] || obj['nlote'] || obj['item'] || obj['id'] || '').replace(/\D/g, '');
                    let nombre = obj['nombre'] || obj['adjudicatario'] || obj['cliente'] || obj['nombresorazonsocial'] || obj['razonsocial'] || '';
                    let montoRaw = obj['montoadjudicado'] || obj['totaladjudicado'] || obj['monto'] || obj['adjudicado'] || obj['total'] || obj['valor'] || obj['precio'] || 0;
                    let rut = obj['rut'] || obj['nrorut'] || obj['rutcliente'] || '';
                    let patente = obj['patente'] || '';

                    let monto = 0;
                    if (typeof montoRaw === 'number') {
                        monto = montoRaw;
                    } else if (typeof montoRaw === 'string') {
                        let str = montoRaw.trim().toUpperCase();
                        if(str.includes('MM')) {
                            let n = parseFloat(str.replace(/[^\d,.-]/g, '').replace(',', '.'));
                            monto = (n || 0) * 1000000;
                        } else {
                            monto = parseInt(str.split(',')[0].replace(/[^\d-]/g, ''), 10) || 0;
                        }
                    }
                    
                    if(monto > 0 && nombre) {
                        adjudicaciones.push({
                            numeroLote: numVal,
                            loteStr: detalleVal,
                            patente: String(patente).trim(),
                            nombreRaw: nombre,
                            rut: rut,
                            monto: monto,
                            pujasCount: 1 // Base
                        });
                    }
                }

                // --- 2. LEER POSTURAS ---
                let sheetPostName = workbook.SheetNames.find(s => s.toLowerCase().includes('posturas') || s.toLowerCase().includes('pujas'));
                
                if (sheetPostName) {
                    const rowsPost = XLSX.utils.sheet_to_json(workbook.Sheets[sheetPostName], {header: 1, defval: ""});
                    
                    let pMaxScore = 0;
                    let pHeaderIdx = -1;
                    let pHeaders = [];
                    
                    for(let i=0; i<Math.min(rowsPost.length, 20); i++){
                        let rowStr = rowsPost[i].map(c => String(c).toLowerCase().trim()).join(' ');
                        let score = 0;
                        if(rowStr.includes('rut') || rowStr.includes('nombre')) score++;
                        if(rowStr.includes('postura') || rowStr.includes('monto') || rowStr.includes('oferta')) score++;
                        if(rowStr.includes('lote') || rowStr.includes('numero') || rowStr.includes('vehiculo')) score++;
                        
                        if(score > pMaxScore) {
                            pMaxScore = score;
                            pHeaderIdx = i;
                            pHeaders = rowsPost[i].map(c => String(c).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, ''));
                        }
                    }
                    
                    if(pHeaderIdx !== -1) {
                        for(let i = pHeaderIdx + 1; i < rowsPost.length; i++) {
                            if(rowsPost[i].join('').trim() === '') continue;
                            let obj = {};
                            for(let j=0; j<pHeaders.length; j++) {
                                if(pHeaders[j]) obj[pHeaders[j]] = rowsPost[i][j];
                            }
                            
                            let loteP = String(obj['lote'] || obj['descripcion'] || obj['vehiculo'] || '').replace(/<[^>]+>/g, '').trim();
                            let numP = String(obj['numero'] || obj['nrolote'] || '').replace(/\D/g, '');
                            
                            if(!loteP && !numP) continue;

                            // Buscar a qué adjudicación pertenece esta puja
                            let matchAdj = adjudicaciones.find(a => {
                                let mStr = a.loteStr && loteP && loteP.includes(a.loteStr);
                                let mNum = a.numeroLote && numP && (loteP.startsWith(a.numeroLote + " ") || a.numeroLote === numP);
                                return mStr || mNum;
                            });

                            if(matchAdj) {
                                matchAdj.pujasCount++;
                            }
                        }
                    }
                }

                resolve({ fileName: file.name, adjudicaciones: adjudicaciones, debug: debugLog });
            } catch(error) { reject(error); }
        };
        reader.readAsArrayBuffer(file);
    });
}
</script>
</body>
</html>
