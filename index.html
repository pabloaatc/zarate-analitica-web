<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zárate Analítica | Core Simple</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { background-color: #F3F4F6; font-family: sans-serif; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- CABECERA Y BOTÓN DE SUBIDA -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-black text-gray-900">Zárate Analítica <span class="text-sm font-normal text-gray-500 bg-gray-100 px-2 py-1 rounded ml-2">Motor V2.1 Restaurado</span></h1>
                <p class="text-sm text-gray-500 mt-1" id="status-text">Sube tu matriz para analizarla al instante.</p>
            </div>
            
            <div>
                <input type="file" id="file-input" multiple accept=".xlsx,.xls" class="hidden" onchange="procesarArchivos(this.files)">
                <label for="file-input" class="cursor-pointer bg-[#111827] hover:bg-black text-white font-bold py-3 px-6 rounded-lg transition shadow-sm inline-block">
                    📁 Subir Excel Zárate
                </label>
            </div>
        </div>

        <!-- TARJETAS DE RESUMEN (KPIs) -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 hidden" id="panel-kpis">
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Venta Total</div>
                <div class="text-xl font-black text-emerald-600 mt-1" id="kpi-venta">$0</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Comisión Est. (12%)</div>
                <div class="text-xl font-black text-blue-600 mt-1" id="kpi-comision">$0</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Lotes Vendidos</div>
                <div class="text-xl font-black text-gray-900 mt-1" id="kpi-lotes">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Ticket Promedio</div>
                <div class="text-xl font-black text-gray-900 mt-1" id="kpi-ticket">$0</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Clientes Únicos</div>
                <div class="text-xl font-black text-indigo-600 mt-1" id="kpi-clientes">0</div>
            </div>
        </div>

        <!-- TABLA DE RESULTADOS -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hidden" id="panel-tabla">
            <div class="overflow-x-auto max-h-[600px]">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-gray-50 text-gray-500 font-bold text-[11px] sticky top-0 uppercase tracking-wider border-b border-gray-200">
                        <tr>
                            <th class="px-4 py-3">Lote</th>
                            <th class="px-4 py-3">Vehículo</th>
                            <th class="px-4 py-3">Patente</th>
                            <th class="px-4 py-3">Adjudicatario</th>
                            <th class="px-4 py-3 text-center">Pujas</th>
                            <th class="px-4 py-3 text-right">Mínimo</th>
                            <th class="px-4 py-3 text-right">Adjudicado</th>
                            <th class="px-4 py-3 text-right">Rentabilidad</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body" class="divide-y divide-gray-100">
                        <!-- Llenado por JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

<script>
const formatMoney = (num) => { 
    return '$' + new Intl.NumberFormat('es-CL').format(Math.round(num || 0)); 
};

async function procesarArchivos(files) {
    const statusText = document.getElementById('status-text');
    if(!files.length) return;
    
    statusText.innerText = "⏳ Procesando Excel...";
    statusText.className = "text-sm mt-1 font-bold text-blue-600";
    
    try {
        let todosLosLotes = [];
        for(let i=0; i<files.length; i++) {
            const data = await parseZarateExcel(files[i]);
            todosLosLotes = todosLosLotes.concat(data);
        }

        if(todosLosLotes.length === 0) {
            statusText.innerText = "❌ Error: 0 lotes encontrados. (Revisa si el excel tiene las columnas monto/adjudicacion y cliente)";
            statusText.className = "text-sm mt-1 font-bold text-red-600";
            return;
        }

        renderUI(todosLosLotes);
        
        statusText.innerText = `✅ ¡Éxito! Se cargaron ${todosLosLotes.length} lotes correctamente.`;
        statusText.className = "text-sm mt-1 font-bold text-emerald-600";
    } catch (e) {
        statusText.innerText = "❌ Error al leer: " + e.message;
        statusText.className = "text-sm mt-1 font-bold text-red-600";
        console.error(e);
    }
}

function renderUI(lotes) {
    document.getElementById('panel-kpis').classList.remove('hidden');
    document.getElementById('panel-tabla').classList.remove('hidden');

    let ventaTotal = 0;
    let clientes = new Set();
    
    lotes.forEach(l => {
        ventaTotal += l.monto;
        if(l.nombreRaw) clientes.add(l.nombreRaw);
    });

    let comision = ventaTotal * 0.12;
    let ticketPromedio = lotes.length > 0 ? ventaTotal / lotes.length : 0;

    document.getElementById('kpi-venta').innerText = formatMoney(ventaTotal);
    document.getElementById('kpi-comision').innerText = formatMoney(comision);
    document.getElementById('kpi-lotes').innerText = lotes.length;
    document.getElementById('kpi-ticket').innerText = formatMoney(ticketPromedio);
    document.getElementById('kpi-clientes').innerText = clientes.size;

    const tablaBody = document.getElementById('tabla-body');
    tablaBody.innerHTML = lotes.map(lote => {
        let delta = lote.monto - lote.minimo;
        let deltaColor = delta > 0 ? 'text-emerald-600' : (delta < 0 ? 'text-red-500' : 'text-gray-400');
        let deltaSign = delta > 0 ? '+' : '';

        return `
            <tr class="hover:bg-gray-50 transition">
                <td class="px-4 py-3 font-bold text-gray-700 text-center">${lote.numeroLote || '-'}</td>
                <td class="px-4 py-3 font-medium text-gray-900 max-w-[250px] truncate" title="${lote.loteStr}">${lote.loteStr}</td>
                <td class="px-4 py-3 font-mono text-gray-500">${lote.patente || '-'}</td>
                <td class="px-4 py-3">
                    <div class="font-bold text-gray-800 truncate max-w-[200px]" title="${lote.nombreRaw}">${lote.nombreRaw}</div>
                    <div class="text-[10px] text-gray-400">${lote.rut || 'Sin RUT'}</div>
                </td>
                <td class="px-4 py-3 text-center"><span class="bg-gray-200 text-gray-700 px-2 py-0.5 rounded font-bold">${lote.pujasCount}</span></td>
                <td class="px-4 py-3 text-right text-gray-500">${formatMoney(lote.minimo)}</td>
                <td class="px-4 py-3 text-right font-black text-emerald-600">${formatMoney(lote.monto)}</td>
                <td class="px-4 py-3 text-right font-bold ${deltaColor}">${lote.minimo > 0 ? deltaSign + formatMoney(delta) : '-'}</td>
            </tr>
        `;
    }).join('');
}

// ==========================================
// EL MOTOR V2.1 PURO (Restaurado con la variable correcta)
// ==========================================
function parseZarateExcel(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                
                // 1. LEER ADJUDICACIONES
                let sheetAdjName = workbook.SheetNames.find(s => s.toLowerCase().includes('adjudicaciones')) || workbook.SheetNames[0];
                const rowsAdj = XLSX.utils.sheet_to_json(workbook.Sheets[sheetAdjName], {header: 1, defval: ""});
                
                let maxScore = 0;
                let headerIdx = 0;
                let headers = [];
                
                for(let i=0; i<Math.min(rowsAdj.length, 20); i++){
                    let rowStr = rowsAdj[i].map(c => String(c).toLowerCase().trim()).join(' ');
                    let score = 0;
                    if(rowStr.includes('rut')) score++;
                    if(rowStr.includes('nombre') || rowStr.includes('cliente') || rowStr.includes('adjudicatario')) score++;
                    if(rowStr.includes('monto') || rowStr.includes('adjudicad') || rowStr.includes('total')) score++;
                    if(rowStr.includes('lote') || rowStr.includes('numero')) score++;
                    if(rowStr.includes('patente') || rowStr.includes('descripci') || rowStr.includes('vehiculo')) score++;
                    
                    if(score > maxScore) {
                        maxScore = score;
                        headerIdx = i;
                        headers = rowsAdj[i].map(c => String(c).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, ''));
                    }
                }

                let adjudicaciones = [];

                for(let i = headerIdx + 1; i < rowsAdj.length; i++) {
                    if(rowsAdj[i].join('').trim() === '') continue;
                    
                    let obj = {};
                    for(let j=0; j<headers.length; j++) {
                        if(headers[j]) obj[headers[j]] = rowsAdj[i][j];
                    }
                    
                    let numVal = String(obj['numero'] || obj['nrolote'] || obj['nlote'] || obj['item'] || obj['id'] || '').replace(/\D/g, '');
                    let nombre = obj['nombre'] || obj['adjudicatario'] || obj['cliente'] || obj['nombresorazonsocial'] || obj['razonsocial'] || '';
                    
                    // ¡AQUÍ ESTABA EL ERROR! Restauré "montoadjudicacion" y "totaladjudicacion"
                    let montoRaw = obj['montoadjudicacion'] || obj['totaladjudicacion'] || obj['montoadjudicado'] || obj['totaladjudicado'] || obj['monto'] || obj['adjudicado'] || obj['total'] || obj['valor'] || obj['precio'] || 0;
                    let minimoRaw = obj['minimo'] || obj['preciobase'] || obj['base'] || 0;
                    let rut = obj['rut'] || obj['nrorut'] || obj['rutcliente'] || '';
                    
                    let monto = typeof montoRaw === 'number' ? montoRaw : parseFloat(String(montoRaw).replace(/[^\d]/g, '')) || 0;
                    let minimo = typeof minimoRaw === 'number' ? minimoRaw : parseFloat(String(minimoRaw).replace(/[^\d]/g, '')) || 0;

                    let textLote = String(obj['lote'] || '').trim();
                    let textDetalle = String(obj['detalle'] || '').trim();
                    
                    let patente = obj['patente'] || '';
                    let vehiculoText = '';

                    // 1. Separar Patente y Auto si vienen en lote (Ej: "ET1190-K: MOTOR FORD")
                    if (textLote.includes(':')) {
                        let parts = textLote.split(':');
                        if(!patente) patente = parts[0].trim();
                        vehiculoText = parts[1].trim();
                    } else {
                        vehiculoText = textLote;
                    }

                    // 2. Extraer del Detalle HTML
                    if (!patente && textDetalle.includes('Patente')) {
                        let match = textDetalle.match(/Patente<\/b><\/td><td[^>]*>:<\/td><td>([^<]+)/i);
                        if (match && match[1]) patente = match[1].trim();
                    }

                    if (!vehiculoText || vehiculoText.length < 4) {
                        let matchMarca = textDetalle.match(/Marca<\/b><\/td><td[^>]*>:<\/td><td>([^<]+)/i);
                        let matchModelo = textDetalle.match(/Modelo<\/b><\/td><td[^>]*>:<\/td><td>([^<]+)/i);
                        let marca = matchMarca && matchMarca[1] ? matchMarca[1].trim() : '';
                        let modelo = matchModelo && matchModelo[1] ? matchModelo[1].trim() : '';
                        vehiculoText = `${marca} ${modelo}`.trim();
                    }

                    vehiculoText = vehiculoText.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();

                    if(monto > 0 && nombre) {
                        adjudicaciones.push({
                            numeroLote: numVal,
                            loteStr: vehiculoText,
                            patente: String(patente).trim().toUpperCase(),
                            nombreRaw: nombre,
                            rut: rut,
                            minimo: minimo,
                            monto: monto,
                            pujasCount: 1 
                        });
                    }
                }

                // 2. LEER POSTURAS
                let sheetPostName = workbook.SheetNames.find(s => s.toLowerCase().includes('posturas') || s.toLowerCase().includes('pujas'));
                
                if (sheetPostName) {
                    const rowsPost = XLSX.utils.sheet_to_json(workbook.Sheets[sheetPostName], {header: 1, defval: ""});
                    
                    let pMaxScore = 0;
                    let pHeaderIdx = -1;
                    let pHeaders = [];
                    
                    for(let i=0; i<Math.min(rowsPost.length, 20); i++){
                        let rowStr = rowsPost[i].map(c => String(c).toLowerCase().trim()).join(' ');
                        let score = 0;
                        if(rowStr.includes('rut') || rowStr.includes('nombre')) score++;
                        if(rowStr.includes('postura') || rowStr.includes('monto') || rowStr.includes('oferta')) score++;
                        if(rowStr.includes('lote') || rowStr.includes('numero') || rowStr.includes('vehiculo')) score++;
                        
                        if(score > pMaxScore) {
                            pMaxScore = score;
                            pHeaderIdx = i;
                            pHeaders = rowsPost[i].map(c => String(c).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, ''));
                        }
                    }
                    
                    if(pHeaderIdx !== -1) {
                        for(let i = pHeaderIdx + 1; i < rowsPost.length; i++) {
                            if(rowsPost[i].join('').trim() === '') continue;
                            let obj = {};
                            for(let j=0; j<pHeaders.length; j++) {
                                if(pHeaders[j]) obj[pHeaders[j]] = rowsPost[i][j];
                            }
                            
                            let loteP = String(obj['lote'] || obj['descripcion'] || obj['vehiculo'] || '').replace(/<[^>]+>/g, '').trim();
                            let numP = String(obj['numero'] || obj['nrolote'] || '').replace(/\D/g, '');
                            
                            let posibleNumero = loteP.split(' ')[0];
                            if (!numP && posibleNumero.match(/^\d+$/)) {
                                numP = posibleNumero;
                            }

                            if(!loteP && !numP) continue;

                            let matchAdj = adjudicaciones.find(a => {
                                let mStr = a.loteStr && loteP && loteP.includes(a.loteStr);
                                let mNum = a.numeroLote && numP && (loteP.startsWith(a.numeroLote + " ") || a.numeroLote === numP);
                                return mStr || mNum;
                            });

                            if(matchAdj) {
                                matchAdj.pujasCount++;
                            }
                        }
                    }
                }

                resolve(adjudicaciones);
            } catch(error) { reject(error); }
        };
        reader.readAsArrayBuffer(file);
    });
}
</script>
</body>
</html>
